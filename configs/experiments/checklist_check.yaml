# 实验基本信息
name: "checklist_quality_check"
description: "检查清单质量和相关性"

# 模型配置
model:
  name: "qwen25"
  path: "/map-vepfs/models/Qwen2.5-72B-Instruct"
  tensor_parallel_size: 8
  gpu_memory_utilization: 0.9
  trust_remote_code: true

# 推理参数
inference:
  max_tokens: 5120
  batch_size: 32
  temperature: 0.1
  top_p: 0.9

# 数据处理
data:
  input_file: "datas/sample_data.json"
  output_file: "results/checklist_quality.json"
  original_field: "check_list"
  prompt_field: "question"
  response_field: "response"

# Prompt配置
prompts:
  checklist_check: |
    我给你一个带编号的证明步骤构成的证明过程，请检查是否存在以下问题：

    问题：
    1. 第一步是解题思路的分析，不属于证明步骤
    2. 最后几步是题目的解释，或者题注。例如评注"本题是***","本题考察了**知识点"之类的
    3. 包含多种解题方案，而不是一种解题方案。（不同解题方面的不算此类）
    4. 以及需要你查看每个证明步骤是否有其他明显问题（比如证明步骤有不完整的编号，）

    回答格式：
    1. 如果存在问题，请回答[评价结果：是]， 如果不存在问题，请回答[评价结果：否]
    2. 如果存在上述步骤，请你给出对应步骤的编号，例如 "不严格证明步骤：[1,2,3]"
    3. 给出[具体问题]：1-2句简短说明问题所在。

    证明步骤：
    {check_list}

# 处理器配置
processor:
  module: "processors.checklist_processor"
  pre_process: ["validate_data", "clean_data"]
  build_prompt: "build_prompt"
  post_process: ["extract_results", "save_statistics"] 